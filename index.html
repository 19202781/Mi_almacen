<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mi Almacen</title>
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Mi%20Almacen%22%2C%22short_name%22%3A%22Almacen%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23F3F4F6%22%2C%22theme_color%22%3A%22%233B82F6%22%7D">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Pantalla Inicio -->
  <div id="inicio" class="pantalla activa">
    <h1 class="titulo-pagina">Inicio</h1>
    <div class="tarjeta resumen">
      <div>
        <span class="cifra" id="totalProductos">--</span>
        <span class="etiqueta">Productos</span>
      </div>
      <div>
        <span class="cifra texto-alerta" id="totalAlertas">--</span>
        <span class="etiqueta">Bajo minimo</span>
      </div>
    </div>
    <h2 class="subtitulo">Sugerencias de compra</h2>
    <div id="sugerencias" class="tarjeta"></div>
    <h2 class="subtitulo">Ultimos movimientos</h2>
    <div id="ultimosMovs" class="tarjeta"></div>
  </div>

  <!-- Pantalla Productos -->
  <div id="productos" class="pantalla">
    <h1 class="titulo-pagina">Productos</h1>
    <input type="text" id="buscarProducto" placeholder="Buscar producto..." oninput="cargarListaProductos()">
    <select id="filtroCategoriaProducto" onchange="cargarListaProductos()"><option value="">Todas las categorias</option></select>
    <div id="listaProductos" class="lista-scroll"></div>
    <button class="btn btn-primario btn-ancho" onclick="nuevoProducto()">+ Agregar producto</button>
    <button class="btn btn-secundario btn-ancho" onclick="mostrarPantalla('categorias')">Gestionar categorias</button>
  </div>

  <!-- Pantalla Categorias -->
  <div id="categorias" class="pantalla">
    <h1 class="titulo-pagina">Categorias</h1>
    <div id="listaCategorias" class="lista-scroll"></div>
    <div class="input-boton">
      <input type="text" id="nuevaCatNombre" placeholder="Nombre de la nueva categoria">
      <button class="btn btn-primario" onclick="agregarCategoria()">Agregar</button>
    </div>
    <button class="btn btn-secundario btn-ancho" onclick="mostrarPantalla('productos')">Volver a productos</button>
  </div>

  <!-- Pantalla Historial -->
  <div id="historial" class="pantalla">
    <h1 class="titulo-pagina">Historial de movimientos</h1>
    <div class="filtros">
      <select id="filtroTipoHistorial" onchange="cargarHistorial()"><option value="">Todos los tipos</option><option value="E">Entradas</option><option value="S">Salidas</option></select>
      <select id="filtroCategoriaHistorial" onchange="cargarHistorial()"><option value="">Todas las categorias</option></select>
    </div>
    <div id="listaHistorial" class="lista-scroll"></div>
  </div>

  <!-- Pantalla Registro de Movimiento -->
  <div id="movimiento" class="pantalla">
    <h1 class="titulo-pagina">Registrar movimiento</h1>
    <div class="selector-tipo">
      <button id="btnE" class="tipo-boton entrada" onclick="setTipo('E')">Entrada</button>
      <button id="btnS" class="tipo-boton salida" onclick="setTipo('S')">Salida</button>
    </div>
    <select id="catMov" onchange="cargarProductos()"><option value="">Seleccione categoria</option></select>
    <div class="input-con-botones">
      <select id="prodMov" onchange="actualizarUnidad()"><option value="">Seleccione producto</option></select>
      <button class="btn btn-icono" onclick="buscarPorCodigoManual()" title="Introducir codigo">[ ]</button>
      <button class="btn btn-icono" onclick="abrirCamara()" title="Escanear con camara">[o]</button>
    </div>
    <p id="unidadMov" class="info-unidad"></p>
    <input type="number" id="cantMov" placeholder="Cantidad">
    <input type="datetime-local" id="fechaMov">
    <input type="text" id="notaMov" placeholder="Nota (opcional)">
    <button class="btn btn-primario btn-ancho" id="btnHecho" onclick="guardarMovimiento()">HECHO</button>
  </div>

  <!-- Pantalla Editar Movimiento -->
  <div id="editarMov" class="pantalla">
    <h1 class="titulo-pagina">Editar movimiento</h1>
    <div id="formEditarMov"></div>
  </div>

  <!-- Pantalla Ficha Producto -->
  <div id="fichaProducto" class="pantalla">
    <h1 class="titulo-pagina" id="nombreFicha"></h1>
    <div id="infoFicha" class="tarjeta"></div>
    <div id="codigosFicha" class="tarjeta">
      <h2 class="subtitulo">Codigos de barras</h2>
      <div id="listaCodigosFicha"></div>
    </div>
    <div id="graficoFicha" class="tarjeta">
      <h2 class="subtitulo">Comportamiento (ultimos meses)</h2>
      <div id="contenidoGrafico"></div>
    </div>
    <button class="btn btn-primario btn-ancho" onclick="registrarDesdeFicha()">Registrar movimiento</button>
    <button class="btn btn-editar btn-ancho" onclick="editarProducto()">Editar producto</button>
    <button class="btn btn-peligro btn-ancho" onclick="eliminarProducto()">Eliminar producto</button>
    <button class="btn btn-secundario btn-ancho" onclick="mostrarPantalla('productos')">Volver a productos</button>
  </div>

  <!-- Pantalla Editar Producto -->
  <div id="editarProducto" class="pantalla">
    <h1 class="titulo-pagina">Editar producto</h1>
    <input type="text" id="editNomProd" placeholder="Nombre del producto">
    <select id="editCatProd"><option value="">Categoria</option></select>
    <select id="editUnidadProd"><option value="U">U (unidad)</option><option value="kg">kg (kilogramo)</option><option value="CAJA">CAJA</option><option value="SACO">SACO</option></select>
    <input type="number" id="editMinProd" placeholder="Stock minimo">
    <input type="number" id="editPrecioProd" placeholder="Precio de compra (CUP)">
    <button class="btn btn-primario btn-ancho" onclick="guardarEdicionProducto()">Guardar cambios</button>
    <button class="btn btn-secundario btn-ancho" onclick="mostrarPantalla('fichaProducto')">Cancelar</button>
  </div>

  <!-- Pantalla Nuevo Producto -->
  <div id="nuevoProducto" class="pantalla">
    <h1 class="titulo-pagina">Nuevo producto</h1>
    <input type="text" id="nomNuevoProd" placeholder="Nombre del producto">
    <select id="catNuevoProd"><option value="">Seleccione categoria</option></select>
    <select id="unidadNuevoProd"><option value="U">U (unidad)</option><option value="kg">kg (kilogramo)</option><option value="CAJA">CAJA</option><option value="SACO">SACO</option></select>
    <input type="number" id="minNuevoProd" placeholder="Stock minimo (opcional)">
    <input type="number" id="precioNuevoProd" placeholder="Precio de compra CUP (opcional)">
    <button class="btn btn-primario btn-ancho" onclick="guardarNuevoProducto()">Guardar producto</button>
  </div>

  <!-- Visor de camara -->
  <div id="visorCamara">
    <video id="videoEscaneo" autoplay playsinline></video>
    <button id="cerrarCamara" class="btn-cerrar-camara" onclick="cerrarCamara()">Cancelar</button>
  </div>

  <!-- Barra de navegacion inferior (botones en mayusculas y con estilo de boton) -->
  <nav class="barra-nav">
    <button onclick="mostrarPantalla('inicio')" class="nav-btn">INICIO</button>
    <button onclick="mostrarPantalla('productos')" class="nav-btn">PRODUCTOS</button>
    <button onclick="irARegistro()" class="nav-btn nav-btn-accion">+ MOV</button>
    <button onclick="mostrarPantalla('historial')" class="nav-btn">HISTORIAL</button>
  </nav>

  <script>
    // ==================== BASE DE DATOS (IndexedDB) ====================
    let db;
    let tipoMov = 'E';
    let idProductoFicha = null;
    let idProductoEditando = null;
    let streamCamara = null;
    let detectorBarcode = null;
    let intervaloDeteccion = null;

    function abrirDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('AlmacenDB', 6);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('categorias')) {
            const catStore = db.createObjectStore('categorias', { keyPath: 'id', autoIncrement: true });
            catStore.createIndex('nombre', 'nombre', { unique: true });
            // Sin categorias predefinidas: el usuario las agrega manualmente
          }
          if (!db.objectStoreNames.contains('productos')) {
            const prodStore = db.createObjectStore('productos', { keyPath: 'id', autoIncrement: true });
            prodStore.createIndex('categoria', 'id_categoria');
          }
          if (!db.objectStoreNames.contains('codigos_barras')) {
            const codStore = db.createObjectStore('codigos_barras', { keyPath: 'id', autoIncrement: true });
            codStore.createIndex('codigo', 'codigo', { unique: true });
            codStore.createIndex('producto', 'id_producto');
          }
          if (!db.objectStoreNames.contains('movimientos')) {
            const movStore = db.createObjectStore('movimientos', { keyPath: 'id', autoIncrement: true });
            movStore.createIndex('producto', 'id_producto');
            movStore.createIndex('fecha', 'fecha_hora');
          }
        };
        request.onsuccess = (e) => { db = e.target.result; resolve(); };
        request.onerror = (e) => reject(e.target.error);
      });
    }

    // ==================== NAVEGACION ====================
    function mostrarPantalla(id) {
      document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
      document.getElementById(id).classList.add('activa');
      if (id === 'inicio') cargarInicio();
      else if (id === 'productos') { cargarCategoriasSelect('filtroCategoriaProducto', cargarListaProductos); cargarListaProductos(); }
      else if (id === 'categorias') cargarListaCategorias();
      else if (id === 'historial') { cargarCategoriasSelect('filtroCategoriaHistorial', cargarHistorial); cargarHistorial(); }
    }

    function irARegistro() {
      mostrarPantalla('movimiento');
      cargarCategoriasSelect('catMov', cargarProductos);
      document.getElementById('fechaMov').value = new Date().toISOString().slice(0,16);
      tipoMov = 'E'; actualizarTipoUI();
    }

    function setTipo(t) { tipoMov = t; actualizarTipoUI(); }
    function actualizarTipoUI() {
      document.getElementById('btnE').classList.toggle('activo', tipoMov === 'E');
      document.getElementById('btnS').classList.toggle('activo', tipoMov === 'S');
    }

    // ==================== CATEGORIAS ====================
    function cargarCategoriasSelect(idSelect, callback) {
      if (!db) return;
      const tx = db.transaction('categorias', 'readonly');
      tx.objectStore('categorias').getAll().onsuccess = (e) => {
        const select = document.getElementById(idSelect);
        const esFiltro = idSelect.includes('filtro');
        select.innerHTML = esFiltro ? '<option value="">Todas</option>' : '<option value="">Seleccione</option>';
        e.target.result.forEach(cat => select.innerHTML += `<option value="${cat.id}">${cat.nombre}</option>`);
        if (callback) callback();
      };
    }

    async function obtenerCategoria(id) {
      const tx = db.transaction('categorias', 'readonly');
      return new Promise(r => { tx.objectStore('categorias').get(id).onsuccess = (e) => r(e.target.result); });
    }

    async function cargarListaCategorias() {
      if (!db) return;
      const tx = db.transaction('categorias', 'readonly');
      const cats = await new Promise(r => { tx.objectStore('categorias').getAll().onsuccess = (e) => r(e.target.result); });
      let html = '';
      for (let cat of cats) {
        const txProd = db.transaction('productos', 'readonly');
        const prods = await new Promise(r => { txProd.objectStore('productos').index('categoria').getAll(cat.id).onsuccess = (e) => r(e.target.result); });
        const count = prods.length;
        html += `<div class="fila-categoria">
          <span>${cat.nombre} <span class="contador">(${count} productos)</span></span>
          <button class="btn-icono-x" onclick="eliminarCategoria(${cat.id})" ${count > 0 ? 'disabled' : ''} title="Eliminar categoria">X</button>
        </div>`;
      }
      document.getElementById('listaCategorias').innerHTML = html || '<p class="vacio">No hay categorias. Agregue una nueva.</p>';
    }

    async function agregarCategoria() {
      const nombre = document.getElementById('nuevaCatNombre').value.trim();
      if (!nombre) return alert('Debe escribir un nombre.');
      const tx = db.transaction('categorias', 'readwrite');
      const store = tx.objectStore('categorias');
      try {
        store.add({ nombre: nombre.toUpperCase() });
        tx.oncomplete = () => {
          document.getElementById('nuevaCatNombre').value = '';
          cargarListaCategorias();
          cargarCategoriasSelect('filtroCategoriaProducto');
          cargarCategoriasSelect('catMov');
          cargarCategoriasSelect('filtroCategoriaHistorial');
        };
      } catch (e) {
        alert('Esa categoria ya existe.');
      }
    }

    async function eliminarCategoria(id) {
      if (!confirm('Eliminar esta categoria? Solo se puede si no tiene productos.')) return;
      const tx = db.transaction('categorias', 'readwrite');
      tx.objectStore('categorias').delete(id);
      tx.oncomplete = () => {
        cargarListaCategorias();
        cargarCategoriasSelect('filtroCategoriaProducto');
        cargarCategoriasSelect('catMov');
        cargarCategoriasSelect('filtroCategoriaHistorial');
      };
    }

    // ==================== PRODUCTOS Y STOCK ====================
    async function obtenerProducto(id) {
      const tx = db.transaction('productos', 'readonly');
      return new Promise(r => { tx.objectStore('productos').get(id).onsuccess = (e) => r(e.target.result); });
    }

    async function obtenerStock(idProducto) {
      const tx = db.transaction('movimientos', 'readonly');
      const movs = await new Promise(r => { tx.objectStore('movimientos').index('producto').getAll(idProducto).onsuccess = (e) => r(e.target.result); });
      return movs.reduce((acc, m) => acc + (m.tipo === 'E' ? m.cantidad : -m.cantidad), 0);
    }

    // ==================== INICIO ====================
    async function cargarInicio() {
      if (!db) return;
      const tx = db.transaction('productos', 'readonly');
      const prods = await new Promise(r => { tx.objectStore('productos').getAll().onsuccess = (e) => r(e.target.result); });
      document.getElementById('totalProductos').textContent = prods.length;
      let alertas = 0;
      const sugerenciasPorCat = {};
      for (let p of prods) {
        const stock = await obtenerStock(p.id);
        if (stock <= (p.stock_minimo || 0)) {
          alertas++;
          const cat = (await obtenerCategoria(p.id_categoria)).nombre;
          if (!sugerenciasPorCat[cat]) sugerenciasPorCat[cat] = [];
          sugerenciasPorCat[cat].push({...p, stock});
        }
      }
      document.getElementById('totalAlertas').textContent = alertas;
      let sugHTML = '';
      for (let cat in sugerenciasPorCat) {
        sugHTML += `<h3 class="nombre-categoria">${cat}</h3>`;
        sugerenciasPorCat[cat].forEach(p => {
          sugHTML += `<div class="item-sugerencia" onclick="registrarDesdeSugerencia(${p.id})">${p.nombre} - Stock: ${p.stock} / Min: ${p.stock_minimo||'--'}</div>`;
        });
      }
      document.getElementById('sugerencias').innerHTML = sugHTML || '<p class="vacio">No hay productos pendientes de reposicion.</p>';
      const txMov = db.transaction('movimientos', 'readonly');
      const movs = await new Promise(r => { txMov.objectStore('movimientos').getAll().onsuccess = (e) => r(e.target.result); });
      movs.sort((a,b) => new Date(b.fecha_hora) - new Date(a.fecha_hora));
      let ultHTML = '';
      for (let m of movs.slice(0,5)) {
        const prod = await obtenerProducto(m.id_producto);
        const tipo = m.tipo === 'E' ? 'Entrada' : 'Salida';
        const clase = m.tipo === 'E' ? 'texto-entrada' : 'texto-salida';
        ultHTML += `<div class="mov-item"><span class="${clase}">${tipo}</span>: ${prod.nombre} - ${m.cantidad} ${prod.unidad} - ${new Date(m.fecha_hora).toLocaleString()}</div>`;
      }
      document.getElementById('ultimosMovs').innerHTML = ultHTML || '<p class="vacio">Sin movimientos.</p>';
    }

    function registrarDesdeSugerencia(idProd) {
      (async () => {
        const prod = await obtenerProducto(idProd);
        mostrarPantalla('movimiento');
        tipoMov = 'E'; actualizarTipoUI();
        cargarCategoriasSelect('catMov', async () => {
          document.getElementById('catMov').value = prod.id_categoria;
          await cargarProductos();
          document.getElementById('prodMov').value = idProd;
          actualizarUnidad();
          document.getElementById('fechaMov').value = new Date().toISOString().slice(0,16);
        });
      })();
    }

    // ==================== LISTA DE PRODUCTOS ====================
    async function cargarListaProductos() {
      if (!db) return;
      const catId = document.getElementById('filtroCategoriaProducto').value;
      const busqueda = document.getElementById('buscarProducto').value.toLowerCase();
      const tx = db.transaction('productos', 'readonly');
      const prods = await new Promise(r => { tx.objectStore('productos').getAll().onsuccess = (e) => r(e.target.result); });
      let html = '';
      for (let p of prods) {
        if (catId && p.id_categoria != catId) continue;
        if (busqueda && !p.nombre.toLowerCase().includes(busqueda)) continue;
        const stock = await obtenerStock(p.id);
        const alerta = stock <= (p.stock_minimo || 0);
        html += `<div class="tarjeta-producto ${alerta ? 'con-alerta' : ''}" onclick="verFicha(${p.id})">
          <div>
            <span class="nombre-producto">${p.nombre}</span>
            <span class="stock-producto ${alerta ? 'texto-alerta' : ''}">Stock: ${stock} ${p.unidad}</span>
          </div>
          ${alerta ? '<span class="indicador-alerta">!</span>' : ''}
        </div>`;
      }
      document.getElementById('listaProductos').innerHTML = html || '<p class="vacio">No hay productos. Agregue uno nuevo.</p>';
    }

    // ==================== FICHA PRODUCTO ====================
    async function verFicha(id) {
      idProductoFicha = id;
      mostrarPantalla('fichaProducto');
      const prod = await obtenerProducto(id);
      document.getElementById('nombreFicha').textContent = prod.nombre;
      const cat = (await obtenerCategoria(prod.id_categoria)).nombre;
      const stock = await obtenerStock(id);
      document.getElementById('infoFicha').innerHTML = `
        <p><span class="etiqueta-dato">Categoria:</span> ${cat}</p>
        <p><span class="etiqueta-dato">Unidad:</span> ${prod.unidad}</p>
        <p><span class="etiqueta-dato">Precio compra:</span> $${prod.precio_cup || '--'} CUP</p>
        <p><span class="etiqueta-dato">Stock minimo:</span> ${prod.stock_minimo || '--'}</p>
        <p><span class="etiqueta-dato">Stock actual:</span> <span class="${stock <= (prod.stock_minimo || 0) ? 'texto-alerta' : ''}">${stock}</span></p>
      `;
      const txCod = db.transaction('codigos_barras', 'readonly');
      const codigos = await new Promise(r => { txCod.objectStore('codigos_barras').index('producto').getAll(id).onsuccess = (e) => r(e.target.result); });
      let codHTML = '';
      codigos.forEach(c => codHTML += `<div class="codigo-item">${c.codigo} <button class="btn-icono-x" onclick="eliminarCodigo(${c.id},${id})">X</button></div>`);
      codHTML += '<button class="btn btn-pequeno" onclick="agregarCodigoFicha()">+ Agregar codigo</button>';
      document.getElementById('listaCodigosFicha').innerHTML = codHTML || 'Sin codigos.';
      document.getElementById('contenidoGrafico').innerHTML = await generarGrafico(id);
    }

    async function eliminarCodigo(idCod, idProd) {
      if (!confirm('Eliminar este codigo?')) return;
